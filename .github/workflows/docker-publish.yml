name: Build and Publish Docker Image

on:
  push:
    branches: ['**']   # build on every branch / fork
    tags: ['v*']       # release tags, e.g. v3.1
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ghcr.io/<owner>/fleet

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Publish only on main or a version tag; forks and PRs build without pushing.
      - name: Decide whether to publish
        id: publish
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
             && { [ "${{ github.ref }}" = "refs/heads/main" ] \
               || [ "${{ github.ref }}" = "refs/heads/master" ] \
               || [ "${{ github.ref_type }}" = "tag" ]; }; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.publish.outputs.value == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr paths must be lowercase; the repo owner/name may not be.
      - name: Lowercase image name
        id: img
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.publish.outputs.value == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only: OSPool/compute targets are x86_64.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
